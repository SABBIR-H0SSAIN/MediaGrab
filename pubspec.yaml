name: mediagrab
description: Download videos & audio from YouTube, Facebook, and Instagram.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # YouTube Extraction
  youtube_explode_dart: ^3.1.0

  # Download Management
  background_downloader: ^9.2.2

  # Media Processing
  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.32

  # Key-Value Store
  shared_preferences: ^2.5.3

  # Storage & Permissions
  path_provider: ^2.1.5
  permission_handler: ^11.4.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Share Intent
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.4

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  dynamic_color: ^1.7.0

  # Utilities
  path: ^1.9.0
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  file_picker: ^8.1.7
  video_player: ^2.9.2
  package_info_plus: ^8.3.0
  equatable: ^2.0.7
  html: ^0.15.5
  xml: ^6.6.1
  crypto: ^3.0.6
  collection: ^1.18.0
  ffmpeg_kit_flutter_new_min: ^3.6.7

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_parser: ^4.1.2
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
